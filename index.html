<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="test-container">
        <h1>Typing Speed Test</h1>

        <p id="sampleText">The quick brown fox jumps over the lazy dog while the sun sets slowly behind the mountains.</p>

        <textarea id="typingArea" placeholder="Start typing here..." rows="4"></textarea>

        <button id="restartBtn">Restart</button>

        <div class="results">
            <p>Time: <span id="timeDisplay">0</span>s</p>
            <p>WPM: <span id="wpmDisplay">0</span></p>
            <p>Accuracy: <span id="accuracyDisplay">100</span>%</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
